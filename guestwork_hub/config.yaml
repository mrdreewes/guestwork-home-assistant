name: GuestWork hub
version: "1.0.0"
slug: guestwork_hub
description: Your property's thermostats in GuestWork, from this Home Assistant. Start it, then open the link it shows.
url: https://guestwork.app
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
# Home Assistant's API, through the Supervisor: the hub reads and sets the thermostats, and nothing else in the house.
homeassistant_api: true
# The host's network: the hub sees the property's router and the devices on it. It listens on no port.
host_network: true
# The hub's token, its private key and settings, what it was waiting to send, and its downloads stay out of Home
# Assistant's backups: a restored backup asks to be linked again.
backup_exclude:
  - hub.json
  - hub.json.old
  - hub-key.json
  - settings.json
  - link.json
  - queue.jsonl
  - last-batch.json
  - install
  - agent
